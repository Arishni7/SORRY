<!DOCTYPE html>
<html>
<head>
  <title>Sayang Surprise</title>
  <style>
    body {
      background: linear-gradient(to right, #ffdde1, #ee9ca7);
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    h1 { 
      color: #d6336c; 
      font-size: 2.5em;
    }
    img { 
      border-radius: 15px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); 
      margin: 20px 0;
    }
    p {
      font-size: 1.2em;
      color: #333;
    }
    button {
      background-color: #ff4081;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 10px;
      cursor: pointer;
      margin: 10px;
      transition: transform 0.3s, background-color 0.3s;
    }
    button:hover { 
      transform: scale(1.2); 
      background-color: #d6336c;
    }
  </style>
</head>
<body>
  <h1>I am sorry sayang 😢❤️</h1>
  <!-- Make sure baby.jpg is uploaded in the same repo folder -->
  <img src="baby.jpg" alt="Pweaseeee" width="100">
  
  <p>Click Yes if you accept my sorry:</p>
  <button onclick="window.location.href='yes.html'">Yes</button>
  <button id="noBtn">No</button>

  <script>
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      const x = Math.floor(Math.random() * 200) - 100;
      const y = Math.floor(Math.random() * 200) - 100;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    });
  </script>
</body>
</html>
